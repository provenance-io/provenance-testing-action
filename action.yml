# action.yml
name: 'Provenance Action'
description: 'Action to test Provenance and Smart Contracts'
inputs:
  github_token:
    description: 'Github token from the workflow'
    required: true
  provenance_version:
    description: 'Version of Provenance to perform test. A release tag, branch, or commit SHA'
    required: true
  smart_contract_action_version:
    description: 'Version of Smart Contract Action to perform test'
    required: false
    default: latest
  init_data:
    description: 'Initial data directory to be used for starting Provenance'
    required: false
  test_script:
    description: 'Script used to run tests after provenance has been setup and is running'
    required: false
runs:
  using: composite
  steps:
    # Release tags already have a published linux zip. Every other ref is built
    # from source because Provenance's release workflow does not run on branch
    # pushes, including main.
    - name: Classify provenance ref
      id: provenance-ref
      shell: bash
      env:
        PROVENANCE_VERSION: ${{ inputs.provenance_version }}
      run: |
        if [[ "$PROVENANCE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
          echo "mode=release" >> "$GITHUB_OUTPUT"
        else
          echo "mode=build" >> "$GITHUB_OUTPUT"
        fi

    - name: Download provenance release
      if: steps.provenance-ref.outputs.mode == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PROVENANCE_VERSION: ${{ inputs.provenance_version }}
      run: |
        gh release download "$PROVENANCE_VERSION" \
          --repo provenance-io/provenance \
          --pattern "provenance-linux-amd64-${PROVENANCE_VERSION}.zip" \
          --dir "$GITHUB_WORKSPACE"

    - name: Checkout provenance
      if: steps.provenance-ref.outputs.mode == 'build'
      uses: actions/checkout@v4
      with:
        repository: provenance-io/provenance
        ref: ${{ inputs.provenance_version }}
        path: provenance-src

    - name: Build provenance linux zip
      if: steps.provenance-ref.outputs.mode == 'build'
      shell: bash
      run: |
        set -euo pipefail
        docker run --rm \
          -v "$GITHUB_WORKSPACE/provenance-src:/src" \
          -v "${{ github.action_path }}/scripts/build_provenance.sh:/usr/local/bin/build_provenance.sh:ro" \
          -w /src \
          -e HOST_UID="$(id -u)" \
          -e HOST_GID="$(id -g)" \
          ubuntu:20.04 \
          bash /usr/local/bin/build_provenance.sh
        cp provenance-src/build/provenance-linux-amd64-*.zip "$GITHUB_WORKSPACE/"
        rm -rf provenance-src

    - name: run smart contract action
      id: smart-contract-action
      shell: bash
      env:
        IMAGE: "provenanceio/smart-contract-action:${{ inputs.smart_contract_action_version }}"
        INIT_DATA: "${{ inputs.init_data != null && inputs.init_data || false }}"
        TEST_SCRIPT: "${{ inputs.test_script != null && inputs.test_script || false }}"
      run: |
        docker pull ${{ env.IMAGE }}
        docker run -v $GITHUB_WORKSPACE:/scratch:Z ${{ env.IMAGE }} ${{ env.INIT_DATA }} ${{ env.TEST_SCRIPT }}
